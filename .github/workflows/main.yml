name: CI/CD Pipeline

on:
  push:
    branches:
      - ITDI204
      - Staging
      - Dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies (backend)
        run: npm install
        working-directory: backend

      - name: Run tests
        run: npm test || echo "No tests available"
        working-directory: backend

      - name: Build check
        run: echo "Build successful ✅"
